<html><head><title>Images</title></head><body>
<h1>Images</h1>
<p>A PNG with transparency: <img src="globe.png" alt="globe"> and a smaller copy:
<img src="globe.png" width="32" height="32" alt="small globe"></p>
<p>A PNG gradient: <img src="gradient.png" alt="gradient"> and with a palette: <img src="palette.png" alt="palette"></p>
<p>A GIF with a transparent background: <img src="shapes.gif" alt="shapes"></p>
<p>BMP files, 24-bit and 8-bit: <img src="colors.bmp" alt="colors"> <img src="colors8.bmp" alt="colors 8"></p>
<p>An image that is missing shows its alternative text: <img src="nothere.png" alt="[missing picture]"></p>
<p>A JPEG cannot be decoded, so its text shows: <img src="photo.jpg" alt="[a photo]"></p>
<p>An image as a link: <a href="index.htm"><img src="globe.png" width="48" height="48" alt="index"></a></p>
</body></html>
